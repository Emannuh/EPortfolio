version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install exact pinned dependencies
        - pip install -r requirements.txt
        # Collect static files into staticfiles/ (required before distill)
        - python manage.py collectstatic --noinput
    build:
      commands:
        # Generate the full static site into dist/
        # django-distill 4.x syntax: distill generate --output-directory <path>
        - python manage.py distill generate --output-directory dist/ --force
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - ~/.cache/pip
